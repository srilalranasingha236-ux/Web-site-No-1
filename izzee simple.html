<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photo Hub</title>

<style>

@keyframes jump {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-20px);
    }
}

    .gallery img:hover {
    transform: translateY(-30px) scale(1.05);
    transition: 0.3s;
}


body {
    margin: 10;
    font-family: Arial;
    background-image: url("Background/—Pngtree—abstract simple background portfolio_1447415.png");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: rgb(19, 17, 17);
    text-align: center;


    background-blend-mode: overlay;
    background-color: rgba(219, 182, 182, 0.521);
}

header {
    padding: 35px 10px;
}

h1 {
    font-size: 56px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    padding: 15px;
}

.gallery img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 10px;
    cursor: pointer;
}

.gallery img:hover {
    opacity: 10.8;
}

footer {
    padding: 60px;
    color: rgb(14, 13, 13);
}

.photo-section {
    text-align: center;
    margin-top: 1px;
}

.photo-section h2 {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #000000;
}

.photo-section p {
    font-size: 14px;
    color: #000000;
    margin-top: 10px;
}

.photo-section .gallery {
    margin-top: 40px;
}


</style>
</head>

<body>

<header>
    <h1>Recent Projects</h1>
    <p>Welcome to my Recent Projects.</p>
</header>


<!-- Photo Section -->


</Section>
<section class="photo-section">

    <h2>MY Certificates</h2>
    <p>Moments captured through my lens.</p>

    <div class="gallery">
        <img src="Photos/Certificate/1.jpg" alt="Certificate">
        <img src="Photos/Certificate/2.jpg" alt="Certificate">
        <img src="Photos/Certificate/3.jpg" alt="Certificate">
        <img src="Photos/Certificate/4.jpg" alt="Certificate">
        <img src="Photos/Certificate/5.jpg" alt="Certificate">
        
    </div>

</section>

<section class="photo-section">

    <h2>MY MEMORIES</h2>
    <p>Every picture tells a story.</p>

    <div class="gallery">
        <img src="Photos/Invitation/1.jpg" alt="Invitation">
        <img src="Photos/Invitation/2.jpg" alt="Invitation">
        <img src="Photos/Invitation/3.jpg" alt="Invitation">
        <img src="Photos/Invitation/4.jpg" alt="Invitation">
        <img src="Photos/Invitation/5.jpg" alt="Invitation">
    </div>

</section>

<section class="photo-section">

    <h2>MY JOURNEY</h2>
    <p>Places, experiences and adventures.</p>

    <div class="gallery">
        <img src="photos/photo5.jpg">
        <img src="photos/photo6.jpg">
    </div>

</section>

<footer>
    © 2026 My Gallery
</footer>

<script>

const photos = document.querySelectorAll(".gallery img");

let currentPhoto = 0;

// Create Lightbox
const lightbox = document.createElement("div");

lightbox.style.cssText = `
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.95);
    z-index:9999;
    justify-content:center;
    align-items:center;
`;

lightbox.innerHTML = `
    <span id="close" style="
        position:absolute;
        top:20px;
        right:30px;
        color:white;
        font-size:40px;
        cursor:pointer;">&times;</span>

    <button id="prev" style="
        position:absolute;
        left:20px;">❮</button>

    <img id="bigPhoto" style="
        max-width:80%;
        max-height:80%;
        object-fit:contain;
        border-radius:12px;">

    <button id="next" style="
        position:absolute;
        right:20px;">❯</button>
`;

document.body.appendChild(lightbox);

const bigPhoto = document.getElementById("bigPhoto");

// Open Photo
function showPhoto(index) {
    currentPhoto = index;
    bigPhoto.src = photos[index].src;
    lightbox.style.display = "flex";
}

photos.forEach((photo, index) => {
    photo.addEventListener("click", () => {
        showPhoto(index);
    });
});

// Next Photo
document.getElementById("next").onclick = () => {
    showPhoto((currentPhoto + 1) % photos.length);
};

// Previous Photo
document.getElementById("prev").onclick = () => {
    showPhoto(
        (currentPhoto - 1 + photos.length) % photos.length
    );
};

// Close
document.getElementById("close").onclick = () => {
    lightbox.style.display = "none";
};

// Keyboard Controls
document.addEventListener("keydown", (e) => {

    if (lightbox.style.display !== "flex") return;

    if (e.key === "Escape") {
        lightbox.style.display = "none";
    }

    if (e.key === "ArrowRight") {
        showPhoto((currentPhoto + 1) % photos.length);
    }

    if (e.key === "ArrowLeft") {
        showPhoto(
            (currentPhoto - 1 + photos.length) % photos.length
        );
    }

});

</script>

</body>
</html>
